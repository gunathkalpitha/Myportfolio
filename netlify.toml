[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  autoLaunch = false

# Redirect /.netlify/functions/* calls during local dev too
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
